<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      /* Light mode colors (default) - Apple style */
      --bg-primary: rgba(255, 255, 255, 0.85);
      --bg-hover: rgba(0, 0, 0, 0.04);
      --bg-selected: rgba(0, 0, 0, 0.06);
      --accent-color: #007aff;
      --border-color: rgba(0, 0, 0, 0.1);
      --text-primary: #000000;
      --text-secondary: rgba(0, 0, 0, 0.5);
      --text-selected: #000000;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(0, 0, 0, 0.05);
      --scrollbar-thumb: rgba(0, 0, 0, 0.15);
      --divider: rgba(0, 0, 0, 0.1);
      --kbd-bg: rgba(0, 0, 0, 0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: rgba(30, 30, 30, 0.85);
        --bg-hover: rgba(255, 255, 255, 0.06);
        --bg-selected: rgba(255, 255, 255, 0.1);
        --accent-color: #0a84ff;
        --border-color: rgba(255, 255, 255, 0.1);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.55);
        --text-selected: #ffffff;
        --shadow: 0 4px 16px rgba(0, 0, 0, 0.4),
                  0 0 0 1px rgba(255, 255, 255, 0.05);
        --scrollbar-thumb: rgba(255, 255, 255, 0.15);
        --divider: rgba(255, 255, 255, 0.1);
        --kbd-bg: rgba(255, 255, 255, 0.1);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: transparent;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }

    .container {
      background: var(--bg-primary);
      backdrop-filter: blur(80px) saturate(200%);
      -webkit-backdrop-filter: blur(80px) saturate(200%);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      overflow: hidden;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 16px 14px 10px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--divider);
    }

    .header .title {
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--text-secondary);
      text-transform: lowercase;
    }

    .results {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
      min-height: 0;
    }

    .result-item {
      padding: 10px;
      border-radius: 6px;
      cursor: default;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
    }

    .result-item .icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 6px;
    }

    .result-item .text {
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
    }

    .result-item:hover {
      background: var(--bg-hover);
    }

    .result-item.selected {
      background: var(--bg-selected);
    }

    .result-item .primary {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-item .secondary {
      font-size: 11px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .no-results {
      padding: 24px 16px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 400;
    }

    /* Scrollbar styling - minimal like macOS */
    .results::-webkit-scrollbar {
      width: 6px;
    }

    .results::-webkit-scrollbar-track {
      background: transparent;
    }

    .results::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 3px;
    }

    /* Keyboard hints */
    .footer {
      padding: 8px 14px 10px 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid var(--divider);
    }

    .hint {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hint kbd {
      background: var(--kbd-bg);
      border-radius: 3px;
      padding: 2px 5px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 11px;
      font-weight: 500;
      min-width: 18px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><div class="title">window-switcher</div></div>
    <div class="results" id="results"></div>
    <div class="footer">
      <span class="hint"><kbd>⌘</kbd><kbd>⇥</kbd> Cycle</span>
      <span class="hint"><kbd>esc</kbd> Cancel</span>
    </div>
  </div>

  <script>
    let windows = [];
    let selectedIndex = 0;

    const resultsContainer = document.getElementById('results');

    // Receive the window list from Hammerspoon (called on each open).
    function initWindows(list) {
      windows = list || [];
      selectedIndex = 0;
      render();
    }

    // Move the highlight; index is 0-based to match the array.
    function setSelection(index) {
      selectedIndex = index;
      render();
    }

    function render() {
      if (windows.length === 0) {
        resultsContainer.innerHTML = '<div class="no-results">No open windows</div>';
        return;
      }

      resultsContainer.innerHTML = windows.map((win, index) => `
        <div class="result-item ${index === selectedIndex ? 'selected' : ''}" data-index="${index}">
          ${win.icon ? `<img class="icon" src="${win.icon}" alt="">` : ''}
          <div class="text">
            <div class="primary">${escapeHtml(win.app || '')}</div>
            <div class="secondary">${escapeHtml(win.title || '')}</div>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.result-item').forEach(item => {
        item.addEventListener('click', () => {
          const index = parseInt(item.dataset.index);
          try {
            webkit.messageHandlers.hammerspoon.postMessage({ action: 'select', index: index });
          } catch (e) {
            console.error('Failed to send to Hammerspoon:', e);
          }
        });
      });

      const selected = document.querySelector('.result-item.selected');
      if (selected) {
        selected.scrollIntoView({ block: 'nearest' });
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
